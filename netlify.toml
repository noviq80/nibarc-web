[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Assets carry a content hash in the filename, so a changed file always
# arrives at a new URL and these are safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/nexora/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons keep stable names, so they must stay revalidatable.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/nexora/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/nexora/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"
